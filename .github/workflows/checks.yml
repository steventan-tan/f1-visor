name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-analysis.txt -r requirements-collect.txt
      - run: python -m compileall -q f1visor detect.py detect_video.py train.py prepare_data.py export_model.py servo_test.py collect_images.py evaluation_plots.py
      - run: python -m unittest discover -s tests -v
      - run: g++ -std=c++11 tests/nano_button_test.cpp -o /tmp/nano-test && /tmp/nano-test
  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr
      - run: arduino-cli compile --fqbn arduino:avr:nano firmware/nano_button
